# The 2026 preliminary game, trained through rlkit. Mirrors the tuned values in
# the top-level config.yaml (which belongs to the legacy ppo_selfplay.py entry
# point); only the two throughput keys were renamed -- map_workers/map_queue are
# instance_workers/instance_queue here, because the framework does not know that
# the per-episode instance happens to be a map.

# ---- rollout ----
# B is the TOTAL number of parallel games; --gpus N gives each rank B/N, so an
# N-GPU run collects the same data per iteration as a 1-GPU run. The rollout is
# kernel-launch bound, so throughput scales almost linearly with B until the GPU
# saturates. The cost is a shorter GAE horizon (steps_per_iter / B), which wants
# to stay comfortably above 1/(1-gamma*lam) ~ 20 steps.
B: 4096
steps_per_iter: 300000
iters: 1250

# ---- phases ----
phase_iters: 250
phases:
  - {lr: 0.0005,  epochs: 5, ent_coef: 0.005,  steps_per_iter: 200000}
  - {lr: 0.0002,  epochs: 4, ent_coef: 0.002,  steps_per_iter: 250000}
  - {lr: 0.0001,  epochs: 3, ent_coef: 0.001,  steps_per_iter: 300000}
  - {lr: 0.00005, epochs: 3, ent_coef: 0.0005, steps_per_iter: 300000}

# ---- PPO ----
gamma: 0.997
lam: 0.95
clip: 0.2
lr: 0.00005
epochs: 3
minibatch: 4096          # TOTAL, split across ranks
# KL early stop DISABLED: with this factored action space the Schulman approx_kl
# saturates once exploration is unlocked and misfires the stop; the clip is the
# trust region instead.
target_kl: null
ent_coef: 0.0005
aux_coef: 0.15
max_grad_norm: 1.0

# ---- model ----
d_model: 64

# ---- game-specific ----
opening_split: true
opp_relax_frac: 0.20
opp_relax_prob: 0.10
n_cap: 109
t_cap: 23

# ---- throughput ----
store_device: cpu        # measured: VRAM is no faster; keep the VRAM for a bigger B
store_vram_frac: 0.45
instance_workers: 6      # PER RANK -- size it for the box you actually train on
                         # (roughly cpu_threads // (3 * n_gpu))
instance_queue: 512
torch_threads: null

# ---- opponent pool ----
opp_ema_alpha: 0.02
pool_add_threshold: 0.6
pool_max_size: 7         # initial cap INCLUDING rusher + japper
pool_snapshot_every: 80
opp_sample_floor: 0.05

# ---- logging ----
use_wandb: true
wandb_project: nypc2026-selfplay
ckpt_path: checkpoint_rlkit.pt
resume: true
log_every: 1
